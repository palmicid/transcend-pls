services:
  nginx:
    image: nginx:alpine
    container_name: nginx-https

    ports:
      - "8443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/generate-cert.sh:/generate-cert.sh
      - nginx_certs:/etc/nginx/certs

    entrypoint: [ "/bin/sh", "-c", "apk add --no-cache openssl && /generate-cert.sh" ]

    depends_on:
      - web
      - minio

    restart: unless-stopped

volumes:
  nginx_certs:
